name: pdv-backend
services:
  auth:
    image: supabase/gotrue:v2.174.0
    container_name: pdv_auth
    restart: always
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: https://lojasys.mentoark.com.br/auth/v1
      GOTRUE_SITE_URL: https://lojasys.mentoark.com.br
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgres://mentoark:__DB_PASSWORD_URLENCODED__@postgres:5432/pdv_prod?search_path=auth
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_JWT_SECRET: __JWT_SECRET__
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_ADMIN_EMAIL: no-reply@mentoark.com.br
      GOTRUE_SMTP_HOST: ""
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: 10
      GOTRUE_PASSWORD_MIN_LENGTH: 6
    networks:
      - proxy
    deploy:
      resources:
        limits:
          memory: 200m

  rest:
    image: postgrest/postgrest:v12.2.8
    container_name: pdv_rest
    restart: always
    environment:
      PGRST_DB_URI: postgres://authenticator:__AUTHENTICATOR_PASSWORD__@postgres:5432/pdv_prod
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: __JWT_SECRET__
      PGRST_DB_USE_LEGACY_GUCS: "false"
    networks:
      - proxy
    deploy:
      resources:
        limits:
          memory: 150m

  gateway:
    image: nginx:alpine
    container_name: pdv_gateway
    restart: always
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth
      - rest
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.pdv-api.rule=Host(`pdvapi.mentoark.com.br`)
      - traefik.http.routers.pdv-api.entrypoints=websecure
      - traefik.http.routers.pdv-api.tls.certresolver=letsencrypt
      - traefik.http.services.pdv-api.loadbalancer.server.port=80
    networks:
      - proxy
    deploy:
      resources:
        limits:
          memory: 50m

networks:
  proxy:
    external: true
