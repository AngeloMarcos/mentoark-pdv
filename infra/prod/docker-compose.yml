# Produção do PDV: https://pdv.mentoark.com.br
# Mesma arquitetura da homologação (infra/homolog), com contêineres pdv_prd_*,
# em /opt/pdv-prod. Substitui o Lovable (site) e o Supabase Cloud (banco,
# login, API e arquivos). Segredos em /opt/pdv-prod/.env (chmod 600).
name: pdv-prod

services:
  db:
    # 17: o pg_dump do Supabase Cloud precisa de cliente igual ou mais novo que o servidor de lá.
    image: postgres:17-alpine
    container_name: pdv_prd_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: pdv
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_connections=60
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - log_min_duration_statement=1000   # loga consultas acima de 1 s
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pdv"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 512m

  auth:
    image: supabase/gotrue:v2.174.0
    container_name: pdv_prd_auth
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SITE_URL}/auth/v1
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: "${SITE_URL}/**"
      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@db:5432/pdv?search_path=auth
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # Sem SMTP configurado, a conta nasce confirmada (MAILER_AUTOCONFIRM=true).
      # Com SMTP no .env, troque para false para exigir confirmação por e-mail.
      GOTRUE_MAILER_AUTOCONFIRM: ${MAILER_AUTOCONFIRM:-true}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-no-reply@mentoark.com.br}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-MentoArk PDV}
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 30
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: 10
      GOTRUE_PASSWORD_MIN_LENGTH: 6
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9999/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 128m

  rest:
    image: postgrest/postgrest:v12.2.8
    container_name: pdv_prd_rest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@db:5432/pdv
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_DB_POOL: 15
      PGRST_DB_MAX_ROWS: 10000
      PGRST_ADMIN_SERVER_PORT: 3001
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 160m

  storage:
    build:
      context: ./mini-storage
    image: pdv-mini-storage:prd
    container_name: pdv_prd_storage
    restart: always
    environment:
      JWT_SECRET: ${JWT_SECRET}
      POSTGREST_URL: http://rest:3000
      DATA_DIR: /data
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 96m

  fiscal:
    build:
      context: ./fiscal-service
    image: pdv-fiscal:prd
    container_name: pdv_prd_fiscal
    restart: always
    depends_on: [rest]
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      ALLOWED_ORIGINS: ${SITE_URL}
      FOCUS_URL_HOMOLOGACAO: https://homologacao.focusnfe.com.br
      # Produção de verdade: empresa com ambiente "Produção" emite nota com valor fiscal.
      FOCUS_URL_PRODUCAO: https://api.focusnfe.com.br
      TZ: America/Sao_Paulo
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 128m

  web:
    image: nginx:1.27-alpine
    container_name: pdv_prd_web
    restart: always
    depends_on: [auth, rest, storage, fiscal]
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/srv/web:ro
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/version.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s
    labels:
      # Fica false até a virada do DNS (PUBLIC=true no .env): sem DNS, o
      # Traefik tentaria o certificado e bateria no limite do Let's Encrypt.
      - traefik.enable=${PUBLIC:-false}
      - traefik.docker.network=proxy
      - traefik.http.routers.pdv-prd.rule=Host(`pdv.mentoark.com.br`)
      - traefik.http.routers.pdv-prd.entrypoints=websecure
      - traefik.http.routers.pdv-prd.tls.certresolver=letsencrypt
      - traefik.http.services.pdv-prd.loadbalancer.server.port=80
    networks: [internal, proxy]
    deploy:
      resources:
        limits:
          memory: 64m

networks:
  internal:
    name: pdv_prd_internal
  proxy:
    external: true

volumes:
  db_data:
    name: pdv_prd_db_data
  storage_data:
    name: pdv_prd_storage_data
