# Frontend estático + API no mesmo domínio (homologpdv.mentoark.com.br).
server {
    listen 80;
    server_name _;
    root /srv/web/html;

    # Homologação não deve aparecer em buscadores.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    resolver 127.0.0.11 valid=30s;

    location /auth/v1/ {
        set $up http://auth:9999;
        rewrite ^/auth/v1/(.*) /$1 break;
        proxy_pass $up;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /rest/v1/ {
        set $up http://rest:3000;
        rewrite ^/rest/v1/(.*) /$1 break;
        proxy_pass $up;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /storage/v1/ {
        set $up http://storage:5000;
        rewrite ^/storage/v1/(.*) /$1 break;
        proxy_pass $up;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10M;
    }

    # Pacote de XMLs do mês: baixa uma nota por vez da Focus, pode levar minutos
    location /fiscal/v1/xml-mensal/ {
        set $up http://fiscal:5100;
        rewrite ^/fiscal/v1/(.*) /$1 break;
        proxy_pass $up;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location /fiscal/v1/ {
        set $up http://fiscal:5100;
        rewrite ^/fiscal/v1/(.*) /$1 break;
        proxy_pass $up;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SEFAZ pode demorar; a Focus responde em até ~30s
        proxy_read_timeout 60s;
        client_max_body_size 1M;
    }

    # Realtime ainda não instalado: responde rápido em vez de cair no SPA.
    location /realtime/ {
        return 404;
    }

    # Arquivos com hash no nome: cache longo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # index.html e version.json nunca em cache (detecção de versão nova).
    location = /version.json {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri /index.html;
    }
}
