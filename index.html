<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply theme before React loads to avoid flash
      (function () {
        try {
          var t = localStorage.getItem('nexus-theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.classList.add(t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <title>Nexus Retail Cloud - PDV Universal</title>
    <meta name="description" content="Sistema de gestão de vendas e estoque na nuvem. PDV moderno para farmácias, mercados, bares e restaurantes." />
    <meta name="author" content="Nexus Retail Cloud" />

    <meta property="og:title" content="Nexus Retail Cloud - PDV Universal" />
    <meta property="og:description" content="Sistema de gestão de vendas e estoque na nuvem" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.jpg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@NexusRetail" />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
